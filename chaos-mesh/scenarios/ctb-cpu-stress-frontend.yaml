---
# Capture the Bug scenario: apply sustained CPU stress to the frontend pod.
# 2 workers each spinning at 80% CPU load — visible as a spike in Kibana's
# Infrastructure view and as increased request latency in APM.
# Duration: 30 minutes (auto-reverts; delete the resource to clean up the CRD).
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: ctb-cpu-stress-frontend
  namespace: MY_NAMESPACE
spec:
  mode: one
  duration: '30m'
  selector:
    namespaces:
      - MY_NAMESPACE
    labelSelectors:
      'app.kubernetes.io/component': 'frontend'
  stressors:
    cpu:
      workers: 2
      load: 80
