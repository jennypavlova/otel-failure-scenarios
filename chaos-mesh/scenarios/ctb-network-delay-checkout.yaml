---
# Capture the Bug scenario: inject 2s network delay on the checkoutservice pod.
# All outbound and inbound traffic to the checkout pod is delayed, making
# checkout transactions visibly slow in APM traces.
# Duration: 30 minutes (auto-reverts; delete the resource to clean up the CRD).
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ctb-network-delay-checkout
  namespace: MY_NAMESPACE
spec:
  action: delay
  mode: one
  duration: '30m'
  selector:
    namespaces:
      - MY_NAMESPACE
    labelSelectors:
      'app.kubernetes.io/component': 'checkout'
  delay:
    latency: '2s'
    jitter: '500ms'
