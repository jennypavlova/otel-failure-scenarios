---
# Capture the Bug scenario: inject 50% packet loss on the paymentservice pod.
# Half of all network packets to/from the payment pod are dropped, causing
# intermittent payment errors — similar symptoms to paymentFailure but at the
# network layer rather than the application layer.
# Duration: 30 minutes (auto-reverts; delete the resource to clean up the CRD).
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ctb-network-loss-payment
  namespace: MY_NAMESPACE
spec:
  action: loss
  mode: one
  duration: '30m'
  selector:
    namespaces:
      - MY_NAMESPACE
    labelSelectors:
      'app.kubernetes.io/component': 'payment'
  loss:
    loss: '50'
    correlation: '25'
