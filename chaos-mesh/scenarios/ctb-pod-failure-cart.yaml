---
# Capture the Bug scenario: inject 100% packet loss on the cartservice pod.
# All network traffic to and from the cart pod is dropped — the service becomes
# completely unreachable, causing checkout to fail with connection errors.
# Note: pod-failure is not used here because GKE Autopilot restricts the device
# cgroup access that Chaos Mesh requires for that action. 100% packet loss
# produces equivalent symptoms: cart is unreachable, connections time out.
# Duration: 30 minutes (auto-reverts; delete the resource to clean up the CRD).
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ctb-pod-failure-cart
  namespace: MY_NAMESPACE
spec:
  action: loss
  mode: one
  duration: '30m'
  selector:
    namespaces:
      - MY_NAMESPACE
    labelSelectors:
      'app.kubernetes.io/component': 'cart'
  loss:
    loss: '100'
