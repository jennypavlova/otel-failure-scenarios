---
# Capture the Bug scenario: inject a 10-second network delay on the
# recommendationservice pod. The frontend times out waiting for recommendations
# and falls back gracefully — recommendation widgets stop appearing.
# Note: pod-failure is not used here because GKE Autopilot restricts the device
# cgroup access that Chaos Mesh requires for that action. A high-latency delay
# causes the frontend to time out, producing the same observable symptom.
# Duration: 30 minutes (auto-reverts; delete the resource to clean up the CRD).
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ctb-pod-failure-recommendation
  namespace: MY_NAMESPACE
spec:
  action: delay
  mode: one
  duration: '30m'
  selector:
    namespaces:
      - MY_NAMESPACE
    labelSelectors:
      'app.kubernetes.io/component': 'recommendation'
  delay:
    latency: '10s'
    jitter: '1s'
